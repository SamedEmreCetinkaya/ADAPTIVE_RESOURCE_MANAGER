# Adaptive Resource Manager policy.
# Amounts are percentages with two decimals, relative to the machine, or CPU selectors.
# Time values are the only absolute numbers because they describe human-scale delays.
#
# Memory values are chosen to work together on 8, 16, 24 and 32 GB machines. See README.md for the
# constraints. `make test` checks them at each of those sizes.

# OBSERVE logs what happens at each focus change and changes nothing. ENFORCE applies the policy.
RUN_MODE=OBSERVE

# Focus handling
FOCUS_DEBOUNCE_MILLISECONDS=500
BACKGROUND_GRACE_SECONDS=30

# Memory, as a percentage of total memory
FOREGROUND_MEMORY_HIGH_PERCENT=65.00
FOREGROUND_MEMORY_LOW_PERCENT=30.00
BACKGROUND_MEMORY_HIGH_PERCENT=55.00

# Swap limits, as a percentage of current total swap. 100.00 means no limit.
# A full swap limit makes the kernel evict file pages, which caused a 2.4 GB/s read storm in testing.
FOREGROUND_SWAP_MAX_PERCENT=100.00
BACKGROUND_SWAP_MAX_PERCENT=100.00

# CPU weight, as a percentage of the group's own weight
FOREGROUND_CPU_WEIGHT_PERCENT=500.00
BACKGROUND_CPU_WEIGHT_PERCENT=100.00

# Hard background CPU limit, as a percentage of all CPU capacity. 100.00 means no limit.
BACKGROUND_CPU_QUOTA_PERCENT=100.00

# CPU placement: ALL, PERFORMANCE, EFFICIENCY, LOW_POWER or LEAST_BUSY.
# Add :PERCENT to use a share of that class, for example EFFICIENCY:50.00 or LEAST_BUSY:10.00.
# ALL leaves every task's affinity untouched.
FOREGROUND_CPU_SET=ALL
BACKGROUND_CPU_SET=ALL

# Reading back the focused application's swapped pages
FOREGROUND_READBACK_ENABLED=1
FOREGROUND_READBACK_INCLUDE_ZRAM=1
FOREGROUND_READBACK_RESERVE_PERCENT=20.00
FOREGROUND_DISK_BUSY_TARGET_PERCENT=60.00
FOREGROUND_PRESSURE_STOP_PERCENT=25.00

# Reading back all disk swap while the system is calm
IDLE_READBACK_ENABLED=1
IDLE_READBACK_CALM_SECONDS=120
IDLE_READBACK_RESERVE_PERCENT=30.00
IDLE_DISK_BUSY_TARGET_PERCENT=25.00
IDLE_PRESSURE_STOP_PERCENT=5.00

# Read pacing. The rate starts low and follows how busy the backing disk is.
READBACK_STEP_MILLISECONDS=60
READBACK_INITIAL_RATE_PERCENT_OF_MEMORY_PER_SECOND=1.00
READBACK_MAX_RATE_PERCENT_OF_MEMORY_PER_SECOND=10.00
READBACK_MAX_CHUNK_PERCENT_OF_MEMORY=0.05

# swapoff cannot be interrupted inside a single large process, so at most this share of memory may
# have to be read at once. Pages still in the swap cache need no read. A file within the limit is
# retired as soon as the system is calm. Other files wait for the idle read.
SWAP_FILE_RETIRE_UNREACHABLE_PERCENT=1.00
# The swap cache is counted for all swap devices together, so the figure above is an estimate. This
# limits the read if the estimate is wrong.
SWAP_FILE_RETIRE_WORST_CASE_READ_PERCENT=5.00
# A file stays if less free swap than this share of memory would remain elsewhere. It covers the time
# swapspace needs to add a new file when demand returns.
SWAP_FILE_RETIRE_MIN_FREE_SWAP_PERCENT=30.00
# Free space kept on the disk that holds the swap files, as a share of that disk. Close to this limit no
# new swap file is opened, even if memory runs out and the kernel has to kill a process. 0 turns this off.
SWAP_FILE_MIN_FREE_DISK_PERCENT=5.00
# Keep equal to SWAP_FILE_MAX_PERCENT in SYSTEM_TUNABLES.conf, so one more file cannot cross the limit.
SWAP_FILE_GROWTH_MARGIN_PERCENT_OF_MEMORY=13.00
SWAP_FILE_DIRECTORY=/var/lib/swapspace
