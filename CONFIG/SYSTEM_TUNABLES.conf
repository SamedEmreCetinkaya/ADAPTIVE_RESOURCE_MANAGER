# System memory settings derived from the machine at each boot. Read as KEY=VALUE, never executed.

# zram device size, as a percentage of total memory
ZRAM_SIZE_PERCENT=70.00
ZRAM_COMPRESSION_ALGORITHM="lz4 zstd(level=3)"

# swapspace file sizes, as a percentage of total memory. Under a fast load swapspace falls behind and
# new files reach the maximum, so a larger maximum uses fewer of the swap files the kernel allows.
SWAP_FILE_MIN_PERCENT=0.80
SWAP_FILE_MAX_PERCENT=13.00

# swapspace thresholds, as a percentage of memory plus swap. swapspace accepts whole numbers.
# The distance between the free target and the lower limit is the size of a new swap file under a slow
# load. The kernel allows about 23 swap files besides zram, so this also sets how far disk swap can grow.
SWAP_FREE_TARGET_PERCENT=23.00
SWAP_LOWER_FREE_LIMIT_PERCENT=20.00
SWAP_UPPER_FREE_LIMIT_PERCENT=60.00

# Dirty page limits, as a percentage of total memory. On 15 GiB these give the 64 and 16 MiB that won an
# A/B test on one NVMe SSD. The best value depends on the disk, so other machines should re-measure.
VM_DIRTY_PERCENT_OF_MEMORY=0.42
VM_DIRTY_BACKGROUND_PERCENT_OF_MEMORY=0.10

VM_SWAPPINESS=100
VM_PAGE_CLUSTER=3
